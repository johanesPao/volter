name: Build dan Push xnspao/volter Docker Image

on:
  push:
    branches: ["main", "development"]
  workflow_dispatch:

jobs:
  build-dan-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code di repository
        uses: actions/checkout@v5
      
      - name: Log in ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:${{ github.sha }}

  deploy-production:
    needs: build-dan-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH dan deploy ke server produksi
        uses: appleboy/ssh-action@v1
        with:
            host: ${{ secrets.PROD_HOST }}
            username: ${{ secrets.PROD_USER }}
            key: ${{ secrets.PROD_SSH_KEY }}
            script: |
              # Buat folder jika tidak eksis
              mkdir -p ~/${{ secrets.APP_NAME }}
              cd ~/${{ secrets.APP_NAME }}

              # Buat .env file dari GitHub secrets
              cat > .env <<EOL
POSTGRES_USER=${{ secrets.POSTGRES_USER }}
POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
POSTGRES_DB=${{ secrets.POSTGRES_DB }}
DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@database:5432/${{ secrets.POSTGRES_DB }}
EOL
              # Pull repo
              git clone git@github.com:johanesPao/volter.git .
              
              # Stop container, prune images, start new container
              docker compose down
              docker image prune -a -f
              docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.APP_NAME }}:main
              docker compose up -d